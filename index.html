<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
        }

        .card {
            width: 90%;
            max-width: 600px;
            padding: 50px 35px;
            text-align: center;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        .card h1 {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .card p {
            font-size: 18px;
            color: #d7d7d7;
            line-height: 1.7;
            margin-bottom: 10px;
        }

        .button {
            display: inline-block;
            margin-top: 25px;
            padding: 13px 28px;
            background: white;
            color: #243b55;
            text-decoration: none;
            font-weight: bold;
            border-radius: 30px;
            transition: 0.3s;
        }

        .button:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(255, 255, 255, 0.25);
        }

        .footer {
            margin-top: 30px;
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>Hello, GitHub! 👋</h1>

        <p>This is my first professional-looking website.</p>

        <p>I am learning HTML, CSS and coding step by step.</p>

        <a href="#" class="button">Explore My Project</a>

        <div class="footer">
            © 2026 My First Project
        </div>
    </div>

</body>
</html>
